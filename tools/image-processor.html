<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="图像处理工具 - 在线图片编辑、格式转换、滤镜效果">
  <title>图像处理 | 开发者工具集</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="./assets/css/tools.css">
  <style>
    /* 主题变量 */
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-tertiary: #0f3460;
      --accent: #e94560;
      --accent-hover: #ff6b6b;
      --text-primary: #eaeaea;
      --text-secondary: #a0a0a0;
      --border: #2d3748;
      --success: #48bb78;
      --warning: #ed8936;
      --error: #f56565;
    }
    
    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f5f9;
      --accent: #2563eb;
      --accent-hover: #3b82f6;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
    }
    
    [data-theme="eyecare"] {
      --bg-primary: #f5f0e6;
      --bg-secondary: #faf8f3;
      --bg-tertiary: #ede8dc;
      --accent: #d97706;
      --accent-hover: #f59e0b;
      --text-primary: #3d3d3d;
      --text-secondary: #6b6b6b;
      --border: #d4cfc4;
      --success: #059669;
      --warning: #d97706;
      --error: #dc2626;
    }
    
    [data-theme="purple"] {
      --bg-primary: #1a1b2e;
      --bg-secondary: #252642;
      --bg-tertiary: #2d2e4f;
      --accent: #a855f7;
      --accent-hover: #c084fc;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --border: #374151;
      --success: #22c55e;
      --warning: #f97316;
      --error: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* 导航栏 */
    .navbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.4s ease;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-brand svg {
      width: 28px;
      height: 28px;
      color: var(--accent);
    }

    .nav-brand h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .nav-btn, .theme-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover, .theme-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .nav-btn svg, .theme-btn svg {
      width: 16px;
      height: 16px;
    }

    /* 主题切换器 */
    .theme-switcher { position: relative; }
    
    .theme-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      min-width: 160px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.2s;
      z-index: 1000;
    }
    
    .theme-dropdown.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    
    .theme-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-secondary);
      font-size: 13px;
    }
    
    .theme-option:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }
    
    .theme-option.active {
      background: var(--accent);
      color: white;
    }

    /* 主内容区 */
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .page-header h2 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* 工具网格 */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .tool-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.4s ease;
    }

    .tool-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .tool-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tool-icon {
      width: 48px;
      height: 48px;
      background: var(--accent);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-icon svg {
      width: 24px;
      height: 24px;
      color: white;
    }

    .tool-title {
      font-size: 18px;
      font-weight: 600;
    }

    .tool-desc {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* 上传区域 */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    .upload-area:hover {
      border-color: var(--accent);
      background: var(--bg-tertiary);
    }

    .upload-area.dragover {
      border-color: var(--accent);
      background: var(--bg-tertiary);
    }

    .upload-area svg {
      width: 48px;
      height: 48px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .upload-text {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .upload-input {
      display: none;
    }

    /* 图片预览 */
    .image-preview {
      display: none;
      margin-bottom: 20px;
    }

    .image-preview.show {
      display: block;
    }

    .preview-container {
      background: var(--bg-tertiary);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .preview-image {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
    }

    .image-info {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* 功能按钮 */
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .action-btn {
      padding: 10px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
    }

    .action-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .action-btn.primary:hover {
      background: var(--accent-hover);
    }

    /* 滑块控制 */
    .slider-control {
      margin-bottom: 16px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--bg-tertiary);
      outline: none;
      -webkit-appearance: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }

    /* 格式选择 */
    .format-select {
      width: 100%;
      padding: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      margin-bottom: 16px;
      cursor: pointer;
    }

    /* 加载动画 */
    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .main-content {
        padding: 20px 16px;
      }

      .tools-grid {
        grid-template-columns: 1fr;
      }

      .action-buttons {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <h1>图像处理</h1>
    </div>
    <div class="nav-actions">
      <div class="theme-switcher">
        <button class="theme-btn" onclick="toggleThemeDropdown()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          主题
        </button>
        <div class="theme-dropdown" id="themeDropdown">
          <div class="theme-option active" data-theme="dark" onclick="switchTheme('dark')">深海蓝</div>
          <div class="theme-option" data-theme="light" onclick="switchTheme('light')">浅雪白</div>
          <div class="theme-option" data-theme="eyecare" onclick="switchTheme('eyecare')">护眼黄</div>
          <div class="theme-option" data-theme="purple" onclick="switchTheme('purple')">紫夜</div>
        </div>
      </div>
      <button class="nav-btn" onclick="location.href='./index.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        返回工具箱
      </button>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="main-content">
    <div class="page-header">
      <h2>图像处理工具</h2>
      <p>在线图片编辑、格式转换、滤镜效果</p>
    </div>

    <!-- 工具网格 -->
    <div class="tools-grid">
      
      <!-- 图片压缩 -->
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </div>
          <div class="tool-title">图片压缩</div>
        </div>
        <div class="tool-desc">压缩图片文件大小，支持JPG、PNG格式，保持画质的同时减小体积</div>
        
        <div class="upload-area" onclick="document.getElementById('compressInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <div class="upload-text">点击或拖拽上传图片</div>
        </div>
        <input type="file" id="compressInput" class="upload-input" accept="image/*" onchange="handleImageUpload(this, 'compress')">
        
        <div class="image-preview" id="compressPreview">
          <div class="preview-container">
            <img class="preview-image" id="compressImage" alt="预览">
            <div class="image-info" id="compressInfo"></div>
          </div>
        </div>

        <div class="slider-control">
          <div class="slider-label">
            <span>压缩质量</span>
            <span id="qualityValue">80%</span>
          </div>
          <input type="range" class="slider" id="qualitySlider" min="10" max="100" value="80" oninput="updateQualityLabel(this.value)">
        </div>

        <div class="action-buttons">
          <button class="action-btn primary" onclick="compressImage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="8 17 12 21 16 17"></polyline>
              <line x1="12" y1="12" x2="12" y2="21"></line>
              <path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"></path>
            </svg>
            开始压缩
          </button>
          <button class="action-btn" onclick="downloadImage('compress')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            下载
          </button>
        </div>
      </div>

      <!-- 格式转换 -->
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <path d="M12 18v-6"></path>
              <path d="M8 15l4 3 4-3"></path>
            </svg>
          </div>
          <div class="tool-title">格式转换</div>
        </div>
        <div class="tool-desc">支持 JPG、PNG、WebP、GIF 等格式互转，满足不同场景需求</div>
        
        <div class="upload-area" onclick="document.getElementById('convertInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <div class="upload-text">点击或拖拽上传图片</div>
        </div>
        <input type="file" id="convertInput" class="upload-input" accept="image/*" onchange="handleImageUpload(this, 'convert')">
        
        <div class="image-preview" id="convertPreview">
          <div class="preview-container">
            <img class="preview-image" id="convertImage" alt="预览">
            <div class="image-info" id="convertInfo"></div>
          </div>
        </div>

        <select class="format-select" id="formatSelect">
          <option value="jpeg">JPG 格式</option>
          <option value="png">PNG 格式</option>
          <option value="webp">WebP 格式</option>
        </select>

        <div class="action-buttons">
          <button class="action-btn primary" onclick="convertImage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            开始转换
          </button>
          <button class="action-btn" onclick="downloadImage('convert')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            下载
          </button>
        </div>
      </div>

      <!-- 滤镜效果 -->
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 1v6m0 6v6m4.22-10.22l4.24-4.24M6.34 6.34L2.1 2.1m17.8 17.8l-4.24-4.24M6.34 17.66l-4.24 4.24M23 12h-6m-6 0H1m20.07-4.93l-4.24 4.24M6.34 6.34l-4.24-4.24"></path>
            </svg>
          </div>
          <div class="tool-title">滤镜效果</div>
        </div>
        <div class="tool-desc">应用各种滤镜效果，包括灰度、复古、模糊、锐化等</div>
        
        <div class="upload-area" onclick="document.getElementById('filterInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <div class="upload-text">点击或拖拽上传图片</div>
        </div>
        <input type="file" id="filterInput" class="upload-input" accept="image/*" onchange="handleImageUpload(this, 'filter')">
        
        <div class="image-preview" id="filterPreview">
          <div class="preview-container">
            <img class="preview-image" id="filterImage" alt="预览">
            <div class="image-info" id="filterInfo"></div>
          </div>
        </div>

        <div class="action-buttons">
          <button class="action-btn" onclick="applyFilter('grayscale')">灰度</button>
          <button class="action-btn" onclick="applyFilter('sepia')">复古</button>
          <button class="action-btn" onclick="applyFilter('blur')">模糊</button>
          <button class="action-btn" onclick="applyFilter('sharpen')">锐化</button>
          <button class="action-btn" onclick="applyFilter('invert')">反色</button>
          <button class="action-btn" onclick="applyFilter('brightness')">增亮</button>
        </div>

        <div class="action-buttons" style="margin-top: 12px;">
          <button class="action-btn" onclick="resetFilter()">重置</button>
          <button class="action-btn primary" onclick="downloadImage('filter')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            下载
          </button>
        </div>
      </div>

    </div>

    <!-- 加载动画 -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>正在处理图片...</p>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 隐藏的Canvas用于图像处理 -->
  <canvas id="processCanvas" style="display: none;"></canvas>

  <script>
    // 主题管理
    const THEME_STORAGE_KEY = 'image_processor_theme';
    let currentTheme = 'dark';
    let currentImages = {};
    let processedImages = {};

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      loadSavedTheme();
      setupDragAndDrop();
    });

    // 主题切换
    function toggleThemeDropdown() {
      document.getElementById('themeDropdown').classList.toggle('show');
    }

    function switchTheme(theme) {
      if (theme === currentTheme) {
        closeThemeDropdown();
        return;
      }

      const body = document.body;
      body.removeAttribute('data-theme');
      if (theme !== 'dark') {
        body.setAttribute('data-theme', theme);
      }

      localStorage.setItem(THEME_STORAGE_KEY, theme);
      currentTheme = theme;

      document.querySelectorAll('.theme-option').forEach(option => {
        option.classList.remove('active');
        if (option.dataset.theme === theme) {
          option.classList.add('active');
        }
      });

      closeThemeDropdown();
      showToast(`已切换到${getThemeName(theme)}主题`);
    }

    function closeThemeDropdown() {
      document.getElementById('themeDropdown').classList.remove('show');
    }

    function getThemeName(theme) {
      const names = { 'dark': '深海蓝', 'light': '浅雪白', 'eyecare': '护眼黄', 'purple': '紫夜' };
      return names[theme] || '深海蓝';
    }

    function loadSavedTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';
      if (savedTheme !== 'dark') {
        document.body.setAttribute('data-theme', savedTheme);
        currentTheme = savedTheme;
        document.querySelectorAll('.theme-option').forEach(option => {
          option.classList.remove('active');
          if (option.dataset.theme === savedTheme) {
            option.classList.add('active');
          }
        });
      }
    }

    // 拖拽上传设置
    function setupDragAndDrop() {
      const uploadAreas = document.querySelectorAll('.upload-area');
      
      uploadAreas.forEach(area => {
        area.addEventListener('dragover', (e) => {
          e.preventDefault();
          area.classList.add('dragover');
        });
        
        area.addEventListener('dragleave', () => {
          area.classList.remove('dragover');
        });
        
        area.addEventListener('drop', (e) => {
          e.preventDefault();
          area.classList.remove('dragover');
          
          const files = e.dataTransfer.files;
          if (files.length > 0 && files[0].type.startsWith('image/')) {
            const type = area.onclick.toString().match(/'(\w+)'/)[1];
            handleFile(files[0], type);
          }
        });
      });
    }

    // 图片上传处理
    function handleImageUpload(input, type) {
      if (input.files && input.files[0]) {
        handleFile(input.files[0], type);
      }
    }

    function handleFile(file, type) {
      if (!file.type.startsWith('image/')) {
        showToast('请上传图片文件');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentImages[type] = img;
          processedImages[type] = img;
          
          // 显示预览
          const preview = document.getElementById(`${type}Preview`);
          const image = document.getElementById(`${type}Image`);
          const info = document.getElementById(`${type}Info`);
          
          image.src = e.target.result;
          info.textContent = `${file.name} | ${img.width} x ${img.height} | ${(file.size / 1024).toFixed(1)} KB`;
          preview.classList.add('show');
          
          showToast('图片上传成功');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 更新质量标签
    function updateQualityLabel(value) {
      document.getElementById('qualityValue').textContent = value + '%';
    }

    // 压缩图片
    function compressImage() {
      if (!currentImages['compress']) {
        showToast('请先上传图片');
        return;
      }

      showLoading(true);
      
      setTimeout(() => {
        const img = currentImages['compress'];
        const quality = document.getElementById('qualitySlider').value / 100;
        const canvas = document.getElementById('processCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        
        const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
        document.getElementById('compressImage').src = compressedDataUrl;
        
        showLoading(false);
        showToast('图片压缩完成');
      }, 500);
    }

    // 转换格式
    function convertImage() {
      if (!currentImages['convert']) {
        showToast('请先上传图片');
        return;
      }

      showLoading(true);
      
      setTimeout(() => {
        const img = currentImages['convert'];
        const format = document.getElementById('formatSelect').value;
        const canvas = document.getElementById('processCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        
        let mimeType = 'image/jpeg';
        if (format === 'png') mimeType = 'image/png';
        if (format === 'webp') mimeType = 'image/webp';
        
        const convertedDataUrl = canvas.toDataURL(mimeType, 0.9);
        document.getElementById('convertImage').src = convertedDataUrl;
        
        showLoading(false);
        showToast(`已转换为 ${format.toUpperCase()} 格式`);
      }, 500);
    }

    // 应用滤镜
    function applyFilter(filterType) {
      if (!currentImages['filter']) {
        showToast('请先上传图片');
        return;
      }

      showLoading(true);
      
      setTimeout(() => {
        const img = currentImages['filter'];
        const canvas = document.getElementById('processCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = img.width;
        canvas.height = img.height;
        
        // 应用滤镜效果
        let filterString = '';
        switch(filterType) {
          case 'grayscale':
            filterString = 'grayscale(100%)';
            break;
          case 'sepia':
            filterString = 'sepia(100%)';
            break;
          case 'blur':
            filterString = 'blur(5px)';
            break;
          case 'sharpen':
            filterString = 'contrast(150%) saturate(150%)';
            break;
          case 'invert':
            filterString = 'invert(100%)';
            break;
          case 'brightness':
            filterString = 'brightness(150%)';
            break;
        }
        
        ctx.filter = filterString;
        ctx.drawImage(img, 0, 0);
        
        const filteredDataUrl = canvas.toDataURL('image/png');
        document.getElementById('filterImage').src = filteredDataUrl;
        processedImages['filter'] = canvas;
        
        showLoading(false);
        showToast('滤镜应用成功');
      }, 300);
    }

    // 重置滤镜
    function resetFilter() {
      if (!currentImages['filter']) {
        showToast('请先上传图片');
        return;
      }
      
      document.getElementById('filterImage').src = currentImages['filter'].src;
      processedImages['filter'] = currentImages['filter'];
      showToast('已重置');
    }

    // 下载图片
    function downloadImage(type) {
      const img = document.getElementById(`${type}Image`);
      if (!img || !img.src || img.src === '') {
        showToast('没有可下载的图片');
        return;
      }

      const link = document.createElement('a');
      link.download = `processed_image_${type}_${Date.now()}.png`;
      link.href = img.src;
      link.click();
      
      showToast('图片下载中...');
    }

    // 显示/隐藏加载动画
    function showLoading(show) {
      document.getElementById('loading').classList.toggle('show', show);
    }

    // Toast提示
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // 点击外部关闭下拉菜单
    document.addEventListener('click', (e) => {
      const themeSwitcher = document.querySelector('.theme-switcher');
      if (themeSwitcher && !themeSwitcher.contains(e.target)) {
        closeThemeDropdown();
      }
    });
  </script>
</body>
</html>
