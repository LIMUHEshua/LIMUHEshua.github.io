<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="天气查询工具 - 实时天气信息查询服务">
  <title>天气查询 | 开发者工具集</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="./assets/css/tools.css">
  <style>
    /* 主题变量 - 与代码助手保持一致 */
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-tertiary: #0f3460;
      --accent: #e94560;
      --accent-hover: #ff6b6b;
      --text-primary: #eaeaea;
      --text-secondary: #a0a0a0;
      --border: #2d3748;
      --success: #48bb78;
      --warning: #ed8936;
      --error: #f56565;
    }
    
    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f5f9;
      --accent: #2563eb;
      --accent-hover: #3b82f6;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
    }
    

    
    [data-theme="purple"] {
      --bg-primary: #1a1b2e;
      --bg-secondary: #252642;
      --bg-tertiary: #2d2e4f;
      --accent: #a855f7;
      --accent-hover: #c084fc;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --border: #374151;
      --success: #22c55e;
      --warning: #f97316;
      --error: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* 导航栏 */
    .navbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.4s ease;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-brand svg {
      width: 28px;
      height: 28px;
      color: var(--accent);
    }

    .nav-brand h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .nav-btn, .theme-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover, .theme-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .nav-btn svg, .theme-btn svg {
      width: 16px;
      height: 16px;
    }

    /* 主题切换器 */
    .theme-switcher { position: relative; }
    
    .theme-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      min-width: 160px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.2s;
      z-index: 1000;
    }
    
    .theme-dropdown.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    
    .theme-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-secondary);
      font-size: 13px;
    }
    
    .theme-option:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }
    
    .theme-option.active {
      background: var(--accent);
      color: white;
    }

    /* 主内容区 */
    .main-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .page-header h2 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* 搜索框 */
    .search-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      transition: all 0.4s ease;
    }

    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-input {
      flex: 1;
      padding: 14px 18px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 15px;
      transition: all 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .search-btn {
      padding: 14px 28px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .search-btn:hover {
      background: var(--accent-hover);
    }

    .search-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 历史记录 */
    .history-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .history-title {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-item {
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .history-item:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    /* 天气结果 */
    .weather-result {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      display: none;
      transition: all 0.4s ease;
    }

    .weather-result.show {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .weather-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .city-info h3 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .city-info p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .weather-icon {
      width: 80px;
      height: 80px;
    }

    .temperature {
      font-size: 48px;
      font-weight: 300;
    }

    .weather-desc {
      color: var(--text-secondary);
      font-size: 16px;
    }

    /* 天气详情网格 */
    .weather-details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .detail-item {
      text-align: center;
      padding: 16px;
      background: var(--bg-tertiary);
      border-radius: 12px;
    }

    .detail-item svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .detail-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 16px;
      font-weight: 600;
    }

    /* 预报 */
    .forecast-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .forecast-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .forecast-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .forecast-item {
      background: var(--bg-tertiary);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .forecast-date {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .forecast-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
    }

    .forecast-temp {
      font-size: 20px;
      font-weight: 600;
    }

    .forecast-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* 加载动画 */
    .loading {
      display: none;
      text-align: center;
      padding: 60px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 错误提示 */
    .error-message {
      display: none;
      background: rgba(245, 101, 101, 0.1);
      border: 1px solid var(--error);
      border-radius: 10px;
      padding: 16px;
      color: var(--error);
      text-align: center;
      margin-top: 16px;
    }

    .error-message.show {
      display: block;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .main-content {
        padding: 20px 16px;
      }

      .search-box {
        flex-direction: column;
      }

      .weather-details {
        grid-template-columns: repeat(2, 1fr);
      }

      .forecast-list {
        grid-template-columns: 1fr;
      }

      .weather-header {
        flex-direction: column;
        gap: 16px;
      }

      .temperature {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>

            <circle cx="12" cy="12" r="5"></circle>

            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>

      <button class="nav-btn" onclick="location.href='./index.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          <polyline points="12 19 5 12 12 5"></polyline>

        返回工具箱
      </button>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="main-content">
    <div class="page-header">
      <h2>天气查询</h2>
      <p>输入城市名称，获取实时天气信息</p>
    </div>

    <!-- 搜索框 -->
    <div class="search-container">
      <div class="search-box">
        <input type="text" class="search-input" id="cityInput" placeholder="请输入城市名称，如：北京、上海、广州..." onkeypress="handleKeyPress(event)">
        <button class="search-btn" id="searchBtn" onclick="searchWeather()">

    <!-- 错误提示 -->

    <!-- 天气结果 -->
    <div class="weather-result" id="weatherResult">
      <div class="weather-header">
        <div class="city-info">
          <h3 id="cityName">--</h3>
          <p id="updateTime">更新时间：--</p>
        </div>
        <div class="weather-main">
          <svg class="weather-icon" id="weatherIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>

      <!-- 天气详情 -->

            <line x1="1" y1="18" x2="3" y2="18"></line>
            <line x1="21" y1="18" x2="23" y2="18"></line>

          <div class="detail-label">能见度</div>
          <div class="detail-value" id="visibility">--km</div>

      <!-- 未来预报 -->
      <div class="forecast-section">
        <div class="forecast-title">未来3天预报</div>
        <div class="forecast-list" id="forecastList">
          <!-- 动态生成 -->
        </div>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // 主题管理
    const THEME_STORAGE_KEY = 'weather_query_theme';
    const HISTORY_STORAGE_KEY = 'weather_query_history';
    let currentTheme = 'dark';
    let searchHistory = [];

    // 模拟天气数据（实际使用时应调用真实API）
    const mockWeatherData = {
      '北京': { temp: 22, desc: '晴', humidity: 45, wind: 3, pressure: 1013, visibility: 10 },
      '上海': { temp: 25, desc: '多云', humidity: 65, wind: 4, pressure: 1010, visibility: 8 },
      '广州': { temp: 28, desc: '阴', humidity: 75, wind: 2, pressure: 1008, visibility: 6 },
      '深圳': { temp: 29, desc: '晴', humidity: 70, wind: 3, pressure: 1009, visibility: 9 },
      '杭州': { temp: 24, desc: '小雨', humidity: 80, wind: 3, pressure: 1011, visibility: 5 },
      '成都': { temp: 20, desc: '阴', humidity: 72, wind: 2, pressure: 1012, visibility: 7 },
      '武汉': { temp: 26, desc: '多云', humidity: 68, wind: 3, pressure: 1010, visibility: 8 },
      '西安': { temp: 23, desc: '晴', humidity: 50, wind: 4, pressure: 1014, visibility: 10 },
    };

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      loadSavedTheme();
      loadSearchHistory();
    });

    // 主题切换
    function toggleThemeDropdown() {
      document.getElementById('themeDropdown').classList.toggle('show');
    }

    function switchTheme(theme) {
      if (theme === currentTheme) {
        closeThemeDropdown();
        return;
      }

      const body = document.body;
      body.removeAttribute('data-theme');
      if (theme !== 'dark') {
        body.setAttribute('data-theme', theme);
      }

      localStorage.setItem(THEME_STORAGE_KEY, theme);
      currentTheme = theme;

      document.querySelectorAll('.theme-option').forEach(option => {
        option.classList.remove('active');
        if (option.dataset.theme === theme) {
          option.classList.add('active');
        }
      });

      closeThemeDropdown();
      showToast(`已切换到${getThemeName(theme)}主题`);
    }

    function closeThemeDropdown() {
      document.getElementById('themeDropdown').classList.remove('show');
    }

    function getThemeName(theme) {
      const names = { 'dark': '深海蓝', 'light': '浅雪白', 'purple': '紫夜' };
      return names[theme] || '深海蓝';
    }

    function loadSavedTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';
      if (savedTheme !== 'dark') {
        document.body.setAttribute('data-theme', savedTheme);
        currentTheme = savedTheme;
        document.querySelectorAll('.theme-option').forEach(option => {
          option.classList.remove('active');
          if (option.dataset.theme === savedTheme) {
            option.classList.add('active');
          }
        });
      }
    }

    // 搜索历史
    function loadSearchHistory() {
      const history = localStorage.getItem(HISTORY_STORAGE_KEY);
      if (history) {
        searchHistory = JSON.parse(history);
        renderHistory();
      }
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      const section = document.getElementById('historySection');
      
      if (searchHistory.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      container.innerHTML = searchHistory.map(city => 
        `<span class="history-item" onclick="searchCity('${city}')">${city}</span>`
      ).join('');
    }

    function addToHistory(city) {
      if (!searchHistory.includes(city)) {
        searchHistory.unshift(city);
        if (searchHistory.length > 5) {
          searchHistory.pop();
        }
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(searchHistory));
        renderHistory();
      }
    }

    // 天气查询
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        searchWeather();
      }
    }

    function searchCity(city) {
      document.getElementById('cityInput').value = city;
      searchWeather();
    }

    async function searchWeather() {
      const city = document.getElementById('cityInput').value.trim();
      if (!city) {
        showToast('请输入城市名称');
        return;
      }

      // 显示加载
      document.getElementById('loading').classList.add('show');
      document.getElementById('weatherResult').classList.remove('show');
      document.getElementById('errorMessage').classList.remove('show');
      document.getElementById('searchBtn').disabled = true;

      // 模拟API调用延迟
      await new Promise(resolve => setTimeout(resolve, 800));

      // 获取天气数据（实际项目中应调用真实天气API）
      const data = mockWeatherData[city] || generateMockData(city);
      
      displayWeather(city, data);
      addToHistory(city);

      document.getElementById('loading').classList.remove('show');
      document.getElementById('searchBtn').disabled = false;
    }

    function generateMockData(city) {
      // 为未预设的城市生成随机但一致的数据
      const seed = city.split('').reduce((a, b) => a + b.charCodeAt(0), 0);
      const temp = 15 + (seed % 20);
      const conditions = ['晴', '多云', '阴', '小雨'];
      return {
        temp: temp,
        desc: conditions[seed % conditions.length],
        humidity: 40 + (seed % 50),
        wind: 1 + (seed % 5),
        pressure: 1000 + (seed % 20),
        visibility: 5 + (seed % 10)
      };
    }

    function displayWeather(city, data) {
      document.getElementById('cityName').textContent = city;
      document.getElementById('updateTime').textContent = '更新时间：' + new Date().toLocaleString('zh-CN');
      document.getElementById('temperature').textContent = data.temp + '°';
      document.getElementById('weatherDesc').textContent = data.desc;
      document.getElementById('humidity').textContent = data.humidity + '%';
      document.getElementById('windSpeed').textContent = data.wind + '级';
      document.getElementById('pressure').textContent = data.pressure + 'hPa';
      document.getElementById('visibility').textContent = data.visibility + 'km';

      // 生成预报数据
      const forecastList = document.getElementById('forecastList');
      const forecasts = [];
      const days = ['明天', '后天', '大后天'];
      
      for (let i = 0; i < 3; i++) {
        const temp = data.temp + Math.floor(Math.random() * 6) - 3;
        const conditions = ['晴', '多云', '阴'];
        const desc = conditions[Math.floor(Math.random() * conditions.length)];
        forecasts.push({
          day: days[i],
          temp: temp,
          desc: desc
        });
      }

      forecastList.innerHTML = forecasts.map(f => `
        <div class="forecast-item">
          <div class="forecast-date">${f.day}</div>
          <svg class="forecast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            ${getWeatherIcon(f.desc)}
          </svg>
          <div class="forecast-temp">${f.temp}°</div>
          <div class="forecast-desc">${f.desc}</div>
        </div>
      `).join('');

      document.getElementById('weatherResult').classList.add('show');
    }

    function getWeatherIcon(desc) {
      const icons = {
        '晴': '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>',
        '多云': '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>',
        '阴': '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>',
        '小雨': '<path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"></path><line x1="16" y1="13" x2="16" y2="21"></line><line x1="8" y1="13" x2="8" y2="21"></line><line x1="12" y1="15" x2="12" y2="23"></line>'
      };
      return icons[desc] || icons['晴'];
    }

    // Toast提示
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // 点击外部关闭下拉菜单
    document.addEventListener('click', (e) => {
      const themeSwitcher = document.querySelector('.theme-switcher');
      if (themeSwitcher && !themeSwitcher.contains(e.target)) {
        closeThemeDropdown();
      }
    });
  </script>
</body>
</html>
