<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown编辑器</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.10.4/dist/index.css">
  <style>
    /* ============================================
       主题颜色方案定义
       ============================================ */
    
    /* 浅色主题 (默认) - Light Frost */
    :root {
      --bg-primary: #f5f5f5;
      --bg-secondary: #ffffff;
      --bg-tertiary: #fafafa;
      --accent: #1976d2;
      --accent-hover: #1565c0;
      --text-primary: #333333;
      --text-secondary: #666666;
      --border: #e0e0e0;
      --success: #4caf50;
      --warning: #ff9800;
      --error: #f44336;
      --vditor-bg: #ffffff;
      --vditor-toolbar: #f5f5f5;
    }
    
    /* 深色主题 - Deep Ocean */
    [data-theme="dark"] {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-tertiary: #0f3460;
      --accent: #e94560;
      --accent-hover: #ff6b6b;
      --text-primary: #eaeaea;
      --text-secondary: #a0a0a0;
      --border: #2d3748;
      --success: #48bb78;
      --warning: #ed8936;
      --error: #f56565;
      --vditor-bg: #1a1a2e;
      --vditor-toolbar: #16213e;
    }
    

    
    /* 紫夜主题 - Purple Night */
    [data-theme="purple"] {
      --bg-primary: #1a1b2e;
      --bg-secondary: #252642;
      --bg-tertiary: #2d2e4f;
      --accent: #a855f7;
      --accent-hover: #c084fc;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --border: #374151;
      --success: #22c55e;
      --warning: #f97316;
      --error: #ef4444;
      --vditor-bg: #1a1b2e;
      --vditor-toolbar: #252642;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    
    /* 全屏容器 */
    .editor-fullscreen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    
    /* 顶部工具栏 */
    .toolbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      height: 50px;
      min-height: 50px;
      transition: all 0.4s ease;
    }
    
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      flex-shrink: 0;
      font-size: 14px;
    }
    
    .logo svg {
      width: 18px;
      height: 18px;
    }
    
    .divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
      transition: background-color 0.4s ease;
    }
    
    .platform-select {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    
    .platform-btn {
      padding: 5px 10px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      color: var(--text-secondary);
    }
    
    .platform-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .platform-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    
    .toolbar-right {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      align-items: center;
    }
    
    .tool-btn, .theme-btn {
      padding: 5px 10px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      white-space: nowrap;
      color: var(--text-secondary);
    }
    
    .tool-btn:hover, .theme-btn:hover {
      background: var(--bg-tertiary);
      border-color: var(--accent);
      color: var(--text-primary);
    }
    
    .tool-btn svg, .theme-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    
    /* 主题切换器 */
    .theme-switcher {
      position: relative;
    }
    
    .theme-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      min-width: 120px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.2s;
      z-index: 10000;
    }
    
    .theme-dropdown.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    
    .theme-option {
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-secondary);
      font-size: 12px;
    }
    
    .theme-option:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }
    
    .theme-option.active {
      background: var(--accent);
      color: white;
    }
    
    /* 主编辑区 */
    .main-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      min-height: 0;
      overflow: hidden;
      transition: background-color 0.4s ease;
    }
    
    .editor-panel, .preview-panel {
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      height: 100%;
      transition: background-color 0.4s ease;
    }
    
    .panel-header {
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      height: 36px;
      transition: all 0.4s ease;
    }
    
    .panel-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    /* Vditor容器 */
    #vditor-container {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    
    /* Vditor主题适配 */
    .vditor {
      height: 100% !important;
      border: none !important;
      position: relative;
      background: var(--vditor-bg) !important;
      transition: background-color 0.4s ease;
    }
    
    .vditor-content {
      height: 100% !important;
    }
    
    .vditor-ir {
      height: 100% !important;
      overflow: auto !important;
      position: relative;
      background: var(--vditor-bg) !important;
      color: var(--text-primary) !important;
      transition: all 0.4s ease;
    }
    
    .vditor-toolbar {
      position: relative;
      z-index: 10;
      background: var(--vditor-toolbar) !important;
      border-bottom: 1px solid var(--border) !important;
      transition: all 0.4s ease;
    }
    
    .vditor-toolbar__item {
      color: var(--text-secondary) !important;
    }
    
    .vditor-toolbar__item:hover {
      color: var(--accent) !important;
      background: var(--bg-tertiary) !important;
    }
    
    .vditor-ir__node--expand {
      background: var(--bg-tertiary) !important;
    }
    
    .vditor-preview {
      background: var(--vditor-bg) !important;
    }
    
    .preview-content {
      flex: 1;
      padding: 20px;
      overflow: auto;
      font-size: 14px;
      line-height: 1.8;
      min-height: 0;
      background: var(--bg-secondary);
      color: var(--text-primary);
      transition: all 0.4s ease;
    }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      
      .toolbar {
        flex-wrap: wrap;
        height: auto;
        min-height: 50px;
      }
      
      .toolbar-left {
        width: 100%;
      }
      
      .toolbar-right {
        width: 100%;
        justify-content: flex-end;
      }
    }
    
    /* Toast提示 */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 10000;
      pointer-events: none;
    }
    
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    /* 加载状态 */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
      font-size: 14px;
    }
    
    /* 错误提示 */
    .error-message {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
      font-size: 14px;
      padding: 20px;
      text-align: center;
    }
    
    .error-message button {
      margin-top: 12px;
      padding: 8px 16px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="editor-fullscreen">
    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="toolbar-left">
        <a href="./index.html" class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          工具箱
        </a>
        <div class="divider"></div>
        <div class="platform-select">
          <button class="platform-btn active" data-platform="default">默认</button>
          <button class="platform-btn" data-platform="wechat">微信</button>
          <button class="platform-btn" data-platform="zhihu">知乎</button>
          <button class="platform-btn" data-platform="juejin">掘金</button>
          <button class="platform-btn" data-platform="csdn">CSDN</button>
        </div>
      </div>
      <div class="toolbar-right">
        <!-- 主题切换器 -->
        <div class="theme-switcher">
          <button class="theme-btn" onclick="toggleThemeDropdown()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            主题
          </button>
          <div class="theme-dropdown" id="themeDropdown">
            <div class="theme-option active" data-theme="light" onclick="switchTheme('light')">浅雪白</div>
            <div class="theme-option" data-theme="dark" onclick="switchTheme('dark')">深海蓝</div>

            <div class="theme-option" data-theme="purple" onclick="switchTheme('purple')">紫夜</div>
          </div>
        </div>
        
        <button class="tool-btn" onclick="copyContent()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          复制
        </button>
        <button class="tool-btn" onclick="downloadMarkdown()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          下载
        </button>
        <button class="tool-btn" onclick="clearContent()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          清空
        </button>
      </div>
    </div>

    <!-- 主编辑区 -->
    <div class="main-container">
      <div class="editor-panel">
        <div class="panel-header">
          <div class="panel-title">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            Markdown
          </div>
        </div>
        <div id="vditor-container">
          <div class="loading">正在加载编辑器...</div>
        </div>
      </div>
      <div class="preview-panel">
        <div class="panel-header">
          <div class="panel-title">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            预览
          </div>
          <button class="tool-btn" onclick="copyHtml()" style="padding: 4px 8px; font-size: 11px;">
            复制HTML
          </button>
        </div>
        <div id="preview" class="preview-content">
          <div style="color: var(--text-secondary); text-align: center; padding-top: 50px;">
            在左侧编辑器输入内容，此处将显示预览
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast提示 -->
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/vditor@3.10.4/dist/index.min.js"></script>
  <script>
    // 全局变量
    let vditor = null;
    let currentPlatform = 'default';
    let isInitialized = false;
    const THEME_STORAGE_KEY = 'markdown_editor_theme';
    let currentTheme = 'light';
    
    // 平台样式配置
    const platformStyles = {
      default: {
        h1: 'font-size: 2em; font-weight: bold; margin: 0.67em 0;',
        h2: 'font-size: 1.5em; font-weight: bold; margin: 0.75em 0;',
        h3: 'font-size: 1.17em; font-weight: bold; margin: 0.83em 0;',
        code: 'background: var(--bg-tertiary); padding: 2px 6px; border-radius: 3px; font-family: monospace;',
        pre: 'background: var(--bg-tertiary); padding: 16px; border-radius: 6px; overflow-x: auto;',
        blockquote: 'border-left: 4px solid var(--accent); padding-left: 16px; color: var(--text-secondary); margin: 1em 0;'
      },
      wechat: {
        h1: 'font-size: 24px; font-weight: bold; margin: 20px 0; color: var(--text-primary);',
        h2: 'font-size: 20px; font-weight: bold; margin: 18px 0; color: var(--text-primary);',
        h3: 'font-size: 18px; font-weight: bold; margin: 16px 0; color: var(--text-primary);',
        code: 'background: var(--bg-tertiary); padding: 2px 6px; border-radius: 3px; font-family: monospace; color: var(--accent);',
        pre: 'background: var(--bg-tertiary); padding: 16px; border-radius: 6px; overflow-x: auto; font-size: 14px;',
        blockquote: 'border-left: 4px solid var(--accent); padding: 12px 16px; background: var(--bg-tertiary); margin: 16px 0;'
      },
      zhihu: {
        h1: 'font-size: 26px; font-weight: 600; margin: 24px 0 16px; color: var(--text-primary);',
        h2: 'font-size: 22px; font-weight: 600; margin: 20px 0 12px; color: var(--text-primary);',
        h3: 'font-size: 18px; font-weight: 600; margin: 16px 0 8px; color: var(--text-primary);',
        code: 'background: var(--bg-tertiary); padding: 2px 6px; border-radius: 4px; font-family: monospace; color: var(--accent);',
        pre: 'background: var(--bg-tertiary); padding: 16px; border-radius: 4px; overflow-x: auto;',
        blockquote: 'border-left: 4px solid var(--accent); padding-left: 16px; color: var(--text-secondary); margin: 16px 0;'
      },
      juejin: {
        h1: 'font-size: 28px; font-weight: 600; margin: 24px 0; color: var(--text-primary);',
        h2: 'font-size: 22px; font-weight: 600; margin: 20px 0; color: var(--text-primary);',
        h3: 'font-size: 18px; font-weight: 600; margin: 16px 0; color: var(--text-primary);',
        code: 'background: var(--bg-tertiary); padding: 2px 6px; border-radius: 4px; font-family: monospace; color: var(--accent);',
        pre: 'background: var(--bg-tertiary); padding: 16px; border-radius: 4px; overflow-x: auto;',
        blockquote: 'border-left: 4px solid var(--accent); padding: 12px 16px; background: var(--bg-tertiary); margin: 16px 0;'
      },
      csdn: {
        h1: 'font-size: 24px; font-weight: bold; margin: 20px 0; color: var(--text-primary);',
        h2: 'font-size: 20px; font-weight: bold; margin: 18px 0; color: var(--text-primary);',
        h3: 'font-size: 16px; font-weight: bold; margin: 16px 0; color: var(--text-primary);',
        code: 'background: var(--bg-tertiary); padding: 2px 4px; border-radius: 3px; font-family: monospace; color: var(--accent);',
        pre: 'background: var(--bg-tertiary); padding: 16px; border-radius: 4px; overflow-x: auto;',
        blockquote: 'border-left: 4px solid var(--accent); padding-left: 16px; color: var(--text-secondary); margin: 16px 0;'
      }
    };
    
    // 主题切换功能
    function toggleThemeDropdown() {
      document.getElementById('themeDropdown').classList.toggle('show');
    }
    
    function closeThemeDropdown() {
      document.getElementById('themeDropdown').classList.remove('show');
    }
    
    function switchTheme(theme) {
      if (theme === currentTheme) {
        closeThemeDropdown();
        return;
      }
      
      const body = document.body;
      body.removeAttribute('data-theme');
      
      if (theme !== 'light') {
        body.setAttribute('data-theme', theme);
      }
      
      localStorage.setItem(THEME_STORAGE_KEY, theme);
      currentTheme = theme;
      
      // 更新UI
      document.querySelectorAll('.theme-option').forEach(option => {
        option.classList.remove('active');
        if (option.dataset.theme === theme) {
          option.classList.add('active');
        }
      });
      
      // 更新Vditor主题
      updateVditorTheme(theme);
      
      closeThemeDropdown();
      showToast(`已切换到${getThemeName(theme)}主题`);
      
      // 刷新预览
      updatePreview();
    }
    
    function updateVditorTheme(theme) {
      if (!vditor) return;
      
      const vditorTheme = theme === 'light' ? 'classic' : 'dark';
      vditor.setTheme(vditorTheme, vditorTheme);
    }
    
    function getThemeName(theme) {
      const names = { 'light': '浅雪白', 'dark': '深海蓝', 'purple': '紫夜' };
      return names[theme] || '浅雪白';
    }
    
    function loadSavedTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'light';
      if (savedTheme !== 'light') {
        document.body.setAttribute('data-theme', savedTheme);
        currentTheme = savedTheme;
        document.querySelectorAll('.theme-option').forEach(option => {
          option.classList.remove('active');
          if (option.dataset.theme === savedTheme) {
            option.classList.add('active');
          }
        });
      }
    }
    
    // 初始化编辑器
    function initEditor() {
      const container = document.getElementById('vditor-container');
      
      if (typeof Vditor === 'undefined') {
        container.innerHTML = `
          <div class="error-message">
            <div>编辑器加载失败</div>
            <button onclick="location.reload()">重新加载</button>
          </div>
        `;
        return;
      }
      
      try {
        const vditorTheme = currentTheme === 'light' ? 'classic' : 'dark';
        
        vditor = new Vditor('vditor-container', {
          height: '100%',
          mode: 'ir',
          placeholder: '开始编写 Markdown...',
          theme: vditorTheme,
          icon: 'material',
          toolbar: [
            'emoji', 'headings', 'bold', 'italic', 'strike', '|',
            'line', 'quote', 'list', 'ordered-list', 'check', '|',
            'code', 'inline-code', 'link', 'table', '|',
            'undo', 'redo', '|',
            'fullscreen'
          ],
          toolbarConfig: { 
            pin: true,
            hide: false
          },
          cache: { 
            enable: true, 
            id: 'markdown-editor-cache-' + location.pathname 
          },
          preview: {
            delay: 500,
            show: false
          },
          after: function() {
            isInitialized = true;
            const defaultContent = '# 欢迎使用 Markdown 编辑器\n\n开始编写你的文章...';
            const savedContent = localStorage.getItem('vditor-markdown-content');
            vditor.setValue(savedContent || defaultContent);
            updatePreview();
          },
          input: function(value) {
            localStorage.setItem('vditor-markdown-content', value);
            updatePreview();
          },
          error: function(error) {
            console.error('Vditor error:', error);
            showToast('编辑器出现错误，请刷新页面重试');
          }
        });
      } catch (error) {
        console.error('Failed to initialize Vditor:', error);
        container.innerHTML = `
          <div class="error-message">
            <div>编辑器初始化失败: ${error.message}</div>
            <button onclick="location.reload()">重新加载</button>
          </div>
        `;
      }
    }
    
    // 更新预览
    function updatePreview() {
      if (!vditor || !isInitialized) return;
      
      try {
        const markdown = vditor.getValue();
        if (!markdown) {
          document.getElementById('preview').innerHTML = `
            <div style="color: var(--text-secondary); text-align: center; padding-top: 50px;">
              在左侧编辑器输入内容，此处将显示预览
            </div>
          `;
          return;
        }
        
        Vditor.md2html(markdown, {
          mode: 'ir',
          theme: currentTheme === 'light' ? 'classic' : 'dark'
        }).then(html => {
          document.getElementById('preview').innerHTML = applyPlatformStyles(html, currentPlatform);
        }).catch(err => {
          console.error('Preview error:', err);
          document.getElementById('preview').innerHTML = `
            <div style="color: var(--text-secondary); text-align: center; padding-top: 50px;">
              预览生成失败，请检查内容格式
            </div>
          `;
        });
      } catch (error) {
        console.error('Update preview error:', error);
      }
    }
    
    // 应用平台样式
    function applyPlatformStyles(html, platform) {
      if (!html) return html;
      
      const styles = platformStyles[platform] || platformStyles.default;
      const temp = document.createElement('div');
      temp.innerHTML = html;
      
      temp.querySelectorAll('h1').forEach(el => el.style.cssText = styles.h1);
      temp.querySelectorAll('h2').forEach(el => el.style.cssText = styles.h2);
      temp.querySelectorAll('h3').forEach(el => el.style.cssText = styles.h3);
      temp.querySelectorAll('code:not(pre code)').forEach(el => el.style.cssText = styles.code);
      temp.querySelectorAll('pre').forEach(el => {
        el.style.cssText = styles.pre;
        el.querySelectorAll('code').forEach(code => code.style.cssText = '');
      });
      temp.querySelectorAll('blockquote').forEach(el => el.style.cssText = styles.blockquote);
      
      return temp.innerHTML;
    }
    
    // 复制内容
    function copyContent() {
      if (!vditor || !isInitialized) {
        showToast('编辑器尚未准备好');
        return;
      }
      
      const content = vditor.getValue();
      if (!content || content.trim() === '') {
        showToast('没有可复制的内容');
        return;
      }
      
      navigator.clipboard.writeText(content).then(() => {
        showToast('已复制到剪贴板');
      }).catch(() => {
        showToast('复制失败，请手动复制');
      });
    }
    
    // 复制HTML
    function copyHtml() {
      const preview = document.getElementById('preview');
      if (!preview || preview.innerText.trim() === '' || preview.innerText.includes('在左侧编辑器输入内容')) {
        showToast('没有可复制的HTML内容');
        return;
      }
      
      navigator.clipboard.writeText(preview.innerHTML).then(() => {
        showToast('HTML已复制');
      }).catch(() => {
        showToast('复制失败，请手动复制');
      });
    }
    
    // 下载Markdown
    function downloadMarkdown() {
      if (!vditor || !isInitialized) {
        showToast('编辑器尚未准备好');
        return;
      }
      
      const content = vditor.getValue();
      if (!content || content.trim() === '') {
        showToast('没有可下载的内容');
        return;
      }
      
      try {
        const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'article-' + new Date().toISOString().slice(0, 10) + '.md';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('文件已下载');
      } catch (error) {
        showToast('下载失败: ' + error.message);
      }
    }
    
    // 清空内容
    function clearContent() {
      if (!vditor || !isInitialized) {
        showToast('编辑器尚未准备好');
        return;
      }
      
      if (confirm('确定要清空所有内容吗？此操作不可恢复。')) {
        vditor.setValue('');
        localStorage.removeItem('vditor-markdown-content');
        updatePreview();
        showToast('内容已清空');
      }
    }
    
    // 显示提示
    function showToast(message) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      
      toast.textContent = message;
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }
    
    // 页面加载完成后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        loadSavedTheme();
        initEditor();
      });
    } else {
      loadSavedTheme();
      initEditor();
    }
    
    // 平台切换事件
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('platform-btn')) {
        document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentPlatform = e.target.dataset.platform;
        updatePreview();
      }
    });
    
    // 点击外部关闭下拉菜单
    document.addEventListener('click', (e) => {
      const themeSwitcher = document.querySelector('.theme-switcher');
      if (themeSwitcher && !themeSwitcher.contains(e.target)) {
        closeThemeDropdown();
      }
    });
    
    // 窗口大小改变时重新调整
    let resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        if (vditor && isInitialized) {
          vditor.resize();
        }
      }, 250);
    });
  </script>
</body>
</html>
