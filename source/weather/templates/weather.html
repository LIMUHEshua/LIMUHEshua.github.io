<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/weather/static/weather.css">
    <title>天气查询 - LIMUHEshua博客</title>
</head>
<body>
    <header>
        <div class="container">
            <h1>🌤 天气查询</h1>
            <p class="subtitle">实时天气查询与未来天气预报</p>
        </div>
    </header>
    
    <div class="container">
        <div class="weather-container">
            <div class="search-wrapper">
                <input type="text" id="city-input" placeholder="请输入城市名称" value="北京">
                <button id="search-btn">查询</button>
            </div>

            <div id="history-container" class="history-container"></div>
            <div id="loading-spinner" class="loading-spinner" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i> 加载中...
            </div>
            <div id="weather-result" class="fade-in"></div>
            <div id="forecast-container" class="forecast-container fade-in"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 LIMUHEshua博客</p>
            <p>专注于 AI、Python、大模型应用、前端框架搭建与硬件开发</p>
        </div>
    </footer>

    <script>
        const HISTORY_KEY = 'weather_history';
        const MAX_HISTORY = 5;

        function getHistory() {
            const history = localStorage.getItem(HISTORY_KEY);
            return history ? JSON.parse(history) : [];
        }

        function addToHistory(city) {
            let history = getHistory();
            history = history.filter(item => item !== city);
            history.unshift(city);
            if (history.length > MAX_HISTORY) {
                history = history.slice(0, MAX_HISTORY);
            }
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = getHistory();
            const container = document.getElementById('history-container');
            if (history.length === 0) {
                container.innerHTML = '';
                return;
            }
            let html = '<span>最近搜索：</span>';
            history.forEach(city => {
                html += `<span class="history-tag" data-city="${city}">${city}</span>`;
            });
            container.innerHTML = html;

            document.querySelectorAll('.history-tag').forEach(tag => {
                tag.addEventListener('click', function() {
                    const city = this.getAttribute('data-city');
                    document.getElementById('city-input').value = city;
                    document.getElementById('search-btn').click();
                });
            });
        }

        function getWeatherIcon(weatherText) {
            if (!weatherText) return 'fa-cloud';
            const map = [
                { keywords: ['晴'], icon: 'fa-sun' },
                { keywords: ['多云'], icon: 'fa-cloud-sun' },
                { keywords: ['阴'], icon: 'fa-cloud' },
                { keywords: ['阵雨', '雷阵雨'], icon: 'fa-cloud-rain' },
                { keywords: ['小雨', '中雨', '大雨', '暴雨'], icon: 'fa-cloud-showers-heavy' },
                { keywords: ['雪', '小雪', '中雪', '大雪'], icon: 'fa-snowflake' },
                { keywords: ['雾', '霾'], icon: 'fa-smog' },
                { keywords: ['冻雨'], icon: 'fa-cloud-rain' },
                { keywords: ['浮尘', '扬沙', '沙尘暴'], icon: 'fa-wind' },
                { keywords: ['雨夹雪'], icon: 'fa-cloud-rain' }
            ];
            for (let group of map) {
                for (let keyword of group.keywords) {
                    if (weatherText.includes(keyword)) {
                        return group.icon;
                    }
                }
            }
            return 'fa-cloud';
        }

        function formatForecastDate(dateStr) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const target = new Date(dateStr);
            target.setHours(0, 0, 0, 0);
            const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return '今天';
            if (diffDays === 1) return '明天';
            if (diffDays === 2) return '后天';
            return `${target.getMonth() + 1}/${target.getDate()}`;
        }

        function renderCurrentWeather(data) {
            if (!data.now) return '';
            const now = data.now;
            const iconClass = getWeatherIcon(now.weather);
            const approxBadge = now.is_approximate ? '<span class="approx-badge">近似</span>' : '';
            const approxNote = now.is_approximate ? '<p class="approx-note">※ 实况数据暂无，此为当天预报近似值</p>' : '';
            return `
                <div class="current-weather">
                    <h2>${now.city}</h2>
                    <div class="weather-icon"><i class="fas ${iconClass}"></i></div>
                    <div class="temperature">${now.temperature}°C ${approxBadge}</div>
                    <div class="weather-desc">${now.weather}</div>
                    <p>风向：${now.winddirection} | 风力：${now.windpower}</p>
                    <p>湿度：${now.humidity}%</p>
                    <p class="update-time">更新时间：${now.reporttime}</p>
                    ${approxNote}
                </div>
            `;
        }

        function renderForecast(forecastList) {
            if (!Array.isArray(forecastList) || forecastList.length === 0) return '';
            const nextDays = forecastList.slice(0, 3);
            let html = '<h3>未来3天预报</h3><div class="forecast-cards">';
            nextDays.forEach(day => {
                const dayIcon = getWeatherIcon(day.dayweather);
                const nightIcon = getWeatherIcon(day.nightweather);
                const displayDate = formatForecastDate(day.date);
                html += `
                    <div class="forecast-card">
                        <div class="forecast-date">${displayDate}</div>
                        <div class="forecast-day">
                            <i class="fas ${dayIcon}"></i> ${day.dayweather}
                            <span class="temp">${day.daytemp}°C</span>
                        </div>
                        <div class="forecast-night">
                            <i class="fas ${nightIcon}"></i> ${day.nightweather}
                            <span class="temp">${day.nighttemp}°C</span>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        function showLoading() {
            document.getElementById('loading-spinner').style.display = 'block';
        }
        function hideLoading() {
            document.getElementById('loading-spinner').style.display = 'none';
        }

        document.getElementById('search-btn').addEventListener('click', function() {
            const city = document.getElementById('city-input').value.trim();
            if (!city) {
                alert("请输入城市名称");
                return;
            }
            showLoading();
            
            // 模拟数据，因为在Hexo博客中FastAPI服务不会运行
            // 实际使用时需要启动后端服务: python weather/main.py
            const mockData = {
                now: {
                    city: city,
                    weather: "晴",
                    temperature: "25",
                    winddirection: "东南风",
                    windpower: "3级",
                    humidity: "60",
                    reporttime: new Date().toLocaleString(),
                    is_approximate: false
                },
                forecast: [
                    {
                        date: new Date().toISOString().split('T')[0],
                        dayweather: "晴",
                        nightweather: "多云",
                        daytemp: "25",
                        nighttemp: "18"
                    },
                    {
                        date: new Date(Date.now() + 86400000).toISOString().split('T')[0],
                        dayweather: "多云",
                        nightweather: "阴",
                        daytemp: "23",
                        nighttemp: "17"
                    },
                    {
                        date: new Date(Date.now() + 172800000).toISOString().split('T')[0],
                        dayweather: "阴",
                        nightweather: "小雨",
                        daytemp: "21",
                        nighttemp: "16"
                    }
                ]
            };
            
            // 模拟API请求延迟
            setTimeout(() => {
                const resultDiv = document.getElementById('weather-result');
                const forecastDiv = document.getElementById('forecast-container');
                resultDiv.innerHTML = '';
                forecastDiv.innerHTML = '';
                
                // 添加提示信息
                resultDiv.innerHTML += `<p class="info">⚠️ 这是模拟数据，实际使用时请启动后端服务: <code>python weather/main.py</code></p>`;
                
                if (mockData.now) {
                    resultDiv.innerHTML += renderCurrentWeather(mockData);
                }
                if (mockData.forecast && mockData.forecast.length > 0) {
                    forecastDiv.innerHTML = renderForecast(mockData.forecast);
                }
                
                addToHistory(city);
                hideLoading();
            }, 1000);
        });

        window.onload = function() {
            renderHistory();
            // 不自动触发搜索，避免在Hexo博客中显示错误
        };
    </script>
</body>
</html>
