<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown编辑器</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.10.4/dist/index.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    
    /* 全屏容器 */
    .editor-fullscreen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    
    /* 顶部工具栏 - 更紧凑 */
    .toolbar {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      height: 50px;
      min-height: 50px;
    }
    
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: #333;
      text-decoration: none;
      flex-shrink: 0;
      font-size: 14px;
    }
    
    .logo svg {
      width: 18px;
      height: 18px;
    }
    
    .divider {
      width: 1px;
      height: 20px;
      background: #e0e0e0;
      flex-shrink: 0;
    }
    
    .platform-select {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    
    .platform-btn {
      padding: 5px 10px;
      border: 1px solid #e0e0e0;
      background: #fff;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    .platform-btn:hover {
      border-color: #1976d2;
      color: #1976d2;
    }
    
    .platform-btn.active {
      background: #1976d2;
      border-color: #1976d2;
      color: #fff;
    }
    
    .toolbar-right {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    
    .tool-btn {
      padding: 5px 10px;
      border: 1px solid #e0e0e0;
      background: #fff;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    .tool-btn:hover {
      background: #f5f5f5;
      border-color: #bbb;
    }
    
    .tool-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    
    /* 主编辑区 - 占据剩余全部空间 */
    .main-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: #e0e0e0;
      min-height: 0;
      overflow: hidden;
    }
    
    .editor-panel, .preview-panel {
      background: #fff;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      height: 100%;
    }
    
    .panel-header {
      padding: 6px 12px;
      background: #fafafa;
      border-bottom: 1px solid #e0e0e0;
      font-size: 12px;
      color: #666;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      height: 36px;
    }
    
    .panel-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    /* Vditor容器 - 关键修复 */
    #vditor-container {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    
    /* 确保Vditor正确显示 */
    .vditor {
      height: 100% !important;
      border: none !important;
      position: relative;
    }
    
    .vditor-content {
      height: 100% !important;
    }
    
    .vditor-ir {
      height: 100% !important;
      overflow: auto !important;
      position: relative;
    }
    
    /* 确保所有子元素可交互 */
    .vditor-ir * {
      pointer-events: auto !important;
    }
    
    /* 编辑器工具栏 */
    .vditor-toolbar {
      position: relative;
      z-index: 10;
    }
    
    .vditor-toolbar * {
      pointer-events: auto !important;
    }
    
    .preview-content {
      flex: 1;
      padding: 20px;
      overflow: auto;
      font-size: 14px;
      line-height: 1.8;
      min-height: 0;
      background: #fff;
    }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      
      .toolbar {
        flex-wrap: wrap;
        height: auto;
        min-height: 50px;
      }
      
      .toolbar-left {
        width: 100%;
      }
      
      .toolbar-right {
        width: 100%;
        justify-content: flex-end;
      }
    }
    
    /* Toast提示 */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 10000;
      pointer-events: none;
    }
    
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    /* 加载状态 */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #999;
      font-size: 14px;
    }
    
    /* 错误提示 */
    .error-message {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
      font-size: 14px;
      padding: 20px;
      text-align: center;
    }
    
    .error-message button {
      margin-top: 12px;
      padding: 8px 16px;
      border: 1px solid #1976d2;
      background: #1976d2;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="editor-fullscreen">
    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="toolbar-left">
        <a href="./index.html" class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          工具箱
        </a>
        <div class="divider"></div>
        <div class="platform-select">
          <button class="platform-btn active" data-platform="default">默认</button>
          <button class="platform-btn" data-platform="wechat">微信</button>
          <button class="platform-btn" data-platform="zhihu">知乎</button>
          <button class="platform-btn" data-platform="juejin">掘金</button>
          <button class="platform-btn" data-platform="csdn">CSDN</button>
        </div>
      </div>
      <div class="toolbar-right">
        <button class="tool-btn" onclick="copyContent()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          复制
        </button>
        <button class="tool-btn" onclick="downloadMarkdown()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          下载
        </button>
        <button class="tool-btn" onclick="clearContent()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          清空
        </button>
      </div>
    </div>

    <!-- 主编辑区 -->
    <div class="main-container">
      <div class="editor-panel">
        <div class="panel-header">
          <div class="panel-title">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            Markdown
          </div>
        </div>
        <div id="vditor-container">
          <div class="loading">正在加载编辑器...</div>
        </div>
      </div>
      <div class="preview-panel">
        <div class="panel-header">
          <div class="panel-title">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            预览
          </div>
          <button class="tool-btn" onclick="copyHtml()" style="padding: 4px 8px; font-size: 11px;">
            复制HTML
          </button>
        </div>
        <div id="preview" class="preview-content">
          <div style="color: #999; text-align: center; padding-top: 50px;">
            在左侧编辑器输入内容，此处将显示预览
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast提示 -->
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/vditor@3.10.4/dist/index.min.js"></script>
  <script>
    const markdownEditor = (() => {
      const state = {
        vditor: null,
        currentPlatform: 'default',
        isInitialized: false,
        resizeTimer: null
      };

      const platformStyles = {
        default: {
          h1: 'font-size: 2em; font-weight: bold; margin: 0.67em 0;',
          h2: 'font-size: 1.5em; font-weight: bold; margin: 0.75em 0;',
          h3: 'font-size: 1.17em; font-weight: bold; margin: 0.83em 0;',
          code: 'background: #f5f5f5; padding: 2px 6px; border-radius: 3px; font-family: monospace;',
          pre: 'background: #f5f5f5; padding: 16px; border-radius: 6px; overflow-x: auto;',
          blockquote: 'border-left: 4px solid #ddd; padding-left: 16px; color: #666; margin: 1em 0;'
        },
        wechat: {
          h1: 'font-size: 24px; font-weight: bold; margin: 20px 0; color: #333;',
          h2: 'font-size: 20px; font-weight: bold; margin: 18px 0; color: #333;',
          h3: 'font-size: 18px; font-weight: bold; margin: 16px 0; color: #333;',
          code: 'background: #f6f8fa; padding: 2px 6px; border-radius: 3px; font-family: monospace; color: #e83e8c;',
          pre: 'background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; font-size: 14px;',
          blockquote: 'border-left: 4px solid #07c160; padding: 12px 16px; background: #f0f9f4; margin: 16px 0;'
        },
        zhihu: {
          h1: 'font-size: 26px; font-weight: 600; margin: 24px 0 16px;',
          h2: 'font-size: 22px; font-weight: 600; margin: 20px 0 12px;',
          h3: 'font-size: 18px; font-weight: 600; margin: 16px 0 8px;',
          code: 'background: #f6f6f6; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #d73a49;',
          pre: 'background: #f6f6f6; padding: 16px; border-radius: 4px; overflow-x: auto;',
          blockquote: 'border-left: 4px solid #0066ff; padding-left: 16px; color: #444; margin: 16px 0;'
        },
        juejin: {
          h1: 'font-size: 28px; font-weight: 600; margin: 24px 0; color: #252933;',
          h2: 'font-size: 22px; font-weight: 600; margin: 20px 0;',
          h3: 'font-size: 18px; font-weight: 600; margin: 16px 0;',
          code: 'background: #f2f3f5; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #d63200;',
          pre: 'background: #f2f3f5; padding: 16px; border-radius: 4px; overflow-x: auto;',
          blockquote: 'border-left: 4px solid #1e80ff; padding: 12px 16px; background: #f4f5f5; margin: 16px 0;'
        },
        csdn: {
          h1: 'font-size: 24px; font-weight: bold; margin: 20px 0;',
          h2: 'font-size: 20px; font-weight: bold; margin: 18px 0;',
          h3: 'font-size: 16px; font-weight: bold; margin: 16px 0;',
          code: 'background: #f5f5f5; padding: 2px 4px; border-radius: 3px; font-family: monospace; color: #c7254e;',
          pre: 'background: #f5f5f5; padding: 16px; border-radius: 4px; overflow-x: auto;',
          blockquote: 'border-left: 4px solid #fc5531; padding-left: 16px; color: #666; margin: 16px 0;'
        }
      };

      function showToast(message) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(showToast.timeoutId);
        showToast.timeoutId = setTimeout(() => toast.classList.remove('show'), 2000);
      }

      function saveContent(value) {
        localStorage.setItem('vditor-markdown-content', value);
      }

      function applyPlatformStyles(html, platform) {
        if (!html) return html;
        const styles = platformStyles[platform] || platformStyles.default;
        const temp = document.createElement('div');
        temp.innerHTML = html;
        temp.querySelectorAll('h1').forEach((el) => el.style.cssText = styles.h1);
        temp.querySelectorAll('h2').forEach((el) => el.style.cssText = styles.h2);
        temp.querySelectorAll('h3').forEach((el) => el.style.cssText = styles.h3);
        temp.querySelectorAll('code:not(pre code)').forEach((el) => el.style.cssText = styles.code);
        temp.querySelectorAll('pre').forEach((el) => {
          el.style.cssText = styles.pre;
          el.querySelectorAll('code').forEach((code) => code.style.cssText = '');
        });
        temp.querySelectorAll('blockquote').forEach((el) => el.style.cssText = styles.blockquote);
        return temp.innerHTML;
      }

      async function renderPreview() {
        if (!state.vditor || !state.isInitialized) return;
        const markdown = state.vditor.getValue();
        const preview = document.getElementById('preview');
        if (!markdown) {
          preview.innerHTML = '<div style="color: #999; text-align: center; padding-top: 50px;">在左侧编辑器输入内容，此处将显示预览</div>';
          return;
        }

        try {
          const html = await Vditor.md2html(markdown, { mode: 'ir', theme: 'classic' });
          preview.innerHTML = applyPlatformStyles(html, state.currentPlatform);
        } catch (error) {
          console.error('Preview error:', error);
          preview.innerHTML = '<div style="color: #999; text-align: center; padding-top: 50px;">预览生成失败，请检查内容格式</div>';
        }
      }

      function initEditor() {
        const container = document.getElementById('vditor-container');
        if (typeof Vditor === 'undefined') {
          container.innerHTML = '<div class="error-message"><div>编辑器加载失败</div><button onclick="location.reload()">重新加载</button></div>';
          return;
        }

        try {
          state.vditor = new Vditor('vditor-container', {
            height: '100%',
            mode: 'ir',
            placeholder: '开始编写 Markdown...',
            theme: 'classic',
            icon: 'material',
            toolbar: ['emoji', 'headings', 'bold', 'italic', 'strike', '|', 'line', 'quote', 'list', 'ordered-list', 'check', '|', 'code', 'inline-code', 'link', 'table', '|', 'undo', 'redo', '|', 'fullscreen'],
            toolbarConfig: { pin: true, hide: false },
            cache: { enable: true, id: 'markdown-editor-cache-' + location.pathname },
            preview: { delay: 500, show: false },
            after: () => {
              state.isInitialized = true;
              const defaultContent = '# 欢迎使用 Markdown 编辑器\n\n开始编写你的文章...';
              const savedContent = localStorage.getItem('vditor-markdown-content');
              state.vditor.setValue(savedContent || defaultContent);
              renderPreview();
            },
            input: (value) => {
              saveContent(value);
              renderPreview();
            },
            error: (error) => {
              console.error('Vditor error:', error);
              showToast('编辑器出现错误，请刷新页面重试');
            }
          });
        } catch (error) {
          console.error('Failed to initialize Vditor:', error);
          container.innerHTML = `<div class="error-message"><div>编辑器初始化失败: ${error.message}</div><button onclick="location.reload()">重新加载</button></div>`;
        }
      }

      function copyContent() {
        if (!state.vditor || !state.isInitialized) {
          showToast('编辑器尚未准备好');
          return;
        }
        const content = state.vditor.getValue();
        if (!content || content.trim() === '') {
          showToast('没有可复制的内容');
          return;
        }
        navigator.clipboard.writeText(content).then(() => showToast('已复制到剪贴板')).catch(() => showToast('复制失败，请手动复制'));
      }

      function copyHtml() {
        const preview = document.getElementById('preview');
        if (!preview || preview.innerText.trim() === '' || preview.innerText.includes('在左侧编辑器输入内容')) {
          showToast('没有可复制的HTML内容');
          return;
        }
        navigator.clipboard.writeText(preview.innerHTML).then(() => showToast('HTML已复制')).catch(() => showToast('复制失败，请手动复制'));
      }

      function downloadMarkdown() {
        if (!state.vditor || !state.isInitialized) {
          showToast('编辑器尚未准备好');
          return;
        }
        const content = state.vditor.getValue();
        if (!content || content.trim() === '') {
          showToast('没有可下载的内容');
          return;
        }
        try {
          const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'article-' + new Date().toISOString().slice(0, 10) + '.md';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('文件已下载');
        } catch (error) {
          showToast('下载失败: ' + error.message);
        }
      }

      function clearContent() {
        if (!state.vditor || !state.isInitialized) {
          showToast('编辑器尚未准备好');
          return;
        }
        if (confirm('确定要清空所有内容吗？此操作不可恢复。')) {
          state.vditor.setValue('');
          localStorage.removeItem('vditor-markdown-content');
          renderPreview();
          showToast('内容已清空');
        }
      }

      function bindEvents() {
        document.addEventListener('click', (event) => {
          if (event.target.classList.contains('platform-btn')) {
            document.querySelectorAll('.platform-btn').forEach((button) => button.classList.remove('active'));
            event.target.classList.add('active');
            state.currentPlatform = event.target.dataset.platform;
            renderPreview();
          }
        });

        window.addEventListener('resize', () => {
          clearTimeout(state.resizeTimer);
          state.resizeTimer = setTimeout(() => {
            if (state.vditor && state.isInitialized) {
              state.vditor.resize();
            }
          }, 250);
        });
      }

      function init() {
        bindEvents();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initEditor);
        } else {
          initEditor();
        }
      }

      return { init, copyContent, copyHtml, downloadMarkdown, clearContent };
    })();

    window.copyContent = () => markdownEditor.copyContent();
    window.copyHtml = () => markdownEditor.copyHtml();
    window.downloadMarkdown = () => markdownEditor.downloadMarkdown();
    window.clearContent = () => markdownEditor.clearContent();
    markdownEditor.init();
  </script>
</body>
</html>
